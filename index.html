<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>星星糖果樂園 — 密室逃脫</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0c1015; }
      canvas { display: block; width: 100%; height: 100%; }
      #crosshair, #interaction-hint { position: fixed; pointer-events: none; color: #fff; }
      #crosshair { left: 50%; top: 50%; transform: translate(-50%, -50%); font: 22px monospace; text-shadow: 0 0 3px #000; }
      #interaction-hint { left: 50%; top: calc(50% + 24px); transform: translateX(-50%); padding: 5px 9px; background: #000b; font: 16px system-ui, sans-serif; white-space: nowrap; }
      #crosshair[hidden], #interaction-hint[hidden] { display: none; }
      #fps {
        position: fixed; top: 8px; left: 8px; padding: 4px 6px;
        color: #dbe6de; background: #0009; font: 12px monospace;
        pointer-events: none;
      }
      #pause-screen {
        position: fixed; inset: 0; z-index: 4; display: grid; place-items: center;
        background: #080b1099; color: #e1e7e7; text-align: center;
        font-family: system-ui, sans-serif; pointer-events: none;
      }
      #pause-screen[hidden] { display: none; }
      #pause-screen section { max-width: 28rem; padding: 24px; background: #151b22e6; border: 1px solid #53606c; }
      #resume { pointer-events: auto; padding: 10px 32px; font: inherit; cursor: pointer; }
      #lock-message { min-height: 1.5em; }
      #input-hud {
        position: fixed; left: 8px; bottom: 8px; max-width: calc(100% - 32px);
        padding: 8px; color: #dbe6de; background: #0009;
        font: 13px system-ui, sans-serif; pointer-events: none;
      }
      #input-hud p { margin: 4px 0; }
      #contact-hint { color: #c7c8b8; }
      #hiding-hint { color: #d5e6c6; }
      #keypad-screen {
        position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
        background: #080b10bb; color: #e1e7e7; font: 16px system-ui, sans-serif;
      }
      #keypad-screen[hidden] { display: none; }
      #keypad-screen section { width: min(340px, calc(100vw - 64px)); padding: 20px; background: #151b22; border: 1px solid #71827d; text-align: center; }
      #keypad-screen h2 { margin: 0 0 12px; }
      #keypad-buffer { display: block; font: 32px monospace; letter-spacing: 0.25em; margin: 12px; }
      #keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      #keypad-screen button { padding: 12px; color: #e1e7e7; background: #29363c; border: 2px solid #53606c; font: inherit; cursor: pointer; touch-action: manipulation; }
      #keypad-screen button.selected { border-color: #c4ed9b; background: #405442; }
      #keypad-screen button:focus-visible { outline: 3px solid #e8efd5; outline-offset: 2px; }
      #keypad-message { min-height: 1.5em; color: #f4cf94; }
      #keypad-back { width: 100%; }
      #keypad-hint { font-size: 13px; line-height: 1.6; }
      #charge-meter { width: 120px; vertical-align: middle; accent-color: #b6df8b; }
      #capture-screen { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; background: #000; pointer-events: none; overflow: hidden; }
      #capture-screen canvas { width: min(86vw, 86vh); height: min(86vw, 86vh); }
      #capture-screen[hidden], #capture-screen canvas[hidden] { display: none; }
      #start-menu { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: #080b10ee; color: #e1e7e7; font: 16px system-ui, sans-serif; }
      #start-menu[hidden] { display: none; }
      #start-menu section { width: min(380px, calc(100vw - 64px)); padding: 24px; background: #151b22; border: 1px solid #71827d; text-align: center; }
      #start-menu button, #start-open { margin: 6px; padding: 10px 24px; color: #e1e7e7; background: #29363c; border: 2px solid #53606c; font: inherit; cursor: pointer; }
      #start-menu button { width: calc(100% - 12px); }
      #start-menu button.selected { border-color: #c4ed9b; background: #405442; }
      #start-menu button:disabled { opacity: 0.5; cursor: default; }
      #start-menu button[hidden], #start-open[hidden] { display: none; }
      #start-open { pointer-events: auto; }
      #save-status { color: #f4cf94; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="crosshair" hidden aria-hidden="true">+</div>
    <div id="interaction-hint" hidden role="status"></div>
    <div id="fps" aria-label="每秒畫格數">FPS: —</div>
    <div id="input-hud">
      <p id="controls-hint">WASD 走路 · 滑鼠轉頭 · Esc 暫停</p>
      <p id="input-hint"></p>
      <p id="contact-hint" hidden role="status" aria-live="polite"></p>
      <p id="hiding-hint" hidden role="status" aria-live="polite"></p>
      <p id="charge-row" hidden><label for="charge-meter">手電筒電量</label> <meter id="charge-meter" min="0" max="100" value="100" aria-describedby="flashlight-mode"></meter> <span id="charge-text" aria-hidden="true">100%</span> · <span id="flashlight-mode">一般光 · 關閉</span></p>
      <p id="gamepad-status">按手把任一鍵喚醒。</p>
      <p id="save-status" role="status" aria-live="polite"></p>
    </div>
    <div id="pause-screen">
      <section aria-labelledby="pause-title">
        <h1 id="pause-title">星星糖果樂園</h1>
        <p id="pause-instructions">按手把任一鍵喚醒，A／✕ 開始，Start／Options 暫停與繼續。</p>
        <button id="resume" type="button">開始（鍵盤滑鼠）</button>
        <button id="start-open" type="button" hidden>返回開始選單</button>
        <p id="lock-message" role="status">點房間畫面或按「開始」鎖定滑鼠。</p>
      </section>
    </div>
    <div id="keypad-screen" hidden>
      <section role="dialog" aria-modal="true" aria-labelledby="keypad-title" aria-describedby="keypad-hint">
        <h2 id="keypad-title">電力室控制器</h2>
        <output id="keypad-buffer" aria-label="已輸入的檢修碼" aria-live="polite">＿＿＿＿</output>
        <div id="keypad-grid" role="group" aria-label="密碼鎖按鍵">
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" data-key="delete">刪除</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="submit">確認</button>
        </div>
        <p id="keypad-message" role="status"></p>
        <button id="keypad-back" type="button">返回</button>
        <p id="keypad-hint"></p>
      </section>
    </div>
    <div id="capture-screen" hidden aria-hidden="true"><canvas id="capture-canvas" hidden></canvas></div>
    <div id="start-menu" hidden>
      <section role="dialog" aria-modal="true" aria-labelledby="start-title" aria-describedby="start-message start-hint">
        <h1 id="start-title">星星糖果樂園</h1>
        <p id="start-message" role="status"></p>
        <p id="start-save-status" role="status" aria-live="polite"></p>
        <button id="start-continue" type="button">繼續</button>
        <button id="start-new" type="button">重新開始</button>
        <button id="start-return" type="button" hidden>返回暫停畫面</button>
        <button id="start-cancel" type="button" hidden>取消，保留進度</button>
        <button id="start-confirm" type="button" hidden>確認重新開始</button>
        <p id="start-hint">手把先按任一鍵喚醒，十字鍵選擇，A／✕ 確認。</p>
      </section>
    </div>
    <script type="module" src="./src/game/main.js"></script>
  </body>
</html>
