<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>S0 存檔與被抓瀏覽器測試</title>
<style>body{font:16px system-ui;background:#eef1ec;color:#152b27;margin:16px}button{padding:12px;margin:4px}iframe{width:100%;height:600px;border:1px solid #888}pre{white-space:pre-wrap}strong{color:#8a331e}</style>
<h1>S0 瀏覽器測試台</h1><p><strong>測試專用：</strong>使用預製的生產線存檔與模擬 Xbox，不能算真人鍵鼠／實體手把通關。會取代此測試 origin 的章節存檔，不修改遊戲檔案。</p>
<button id="run">建立測試存檔並啟動模擬手把</button><button id="enter">前進進入生產線（1.3 秒）</button><button id="pause">Start 暫停／繼續</button><button id="summary">讀取存檔摘要</button><button id="reload">重新載入遊戲框架</button>
<pre id="log" role="log"></pre><iframe id="game" title="實際遊戲 WebGL 測試框架"></iframe>
<script type="module">
import {createChapter,serializeChapterSave} from '../src/logic/index.js';
const key='star-candy-park.chapter-1.save',frame=document.querySelector('#game'),log=document.querySelector('#log');
let text='',doc=null,observer=null,captured=0,recovered=0;
const say=s=>{log.textContent+=new Date().toISOString()+' '+s+'\n';};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function summary(){const raw=localStorage.getItem(key);say('存檔 '+raw);return raw;}
const padScript=`<script>window.qaPad={id:'Xbox QA simulated',index:0,mapping:'standard',connected:true,axes:[0,0,0,0],buttons:Array.from({length:17},()=>({pressed:false,value:0}))};Object.defineProperty(navigator,'getGamepads',{value:()=>[window.qaPad]});<`+`/script>`;
async function load(){
 if(observer)observer.disconnect();doc=null;
 text ||= await (await fetch('../index.html')).text();
 frame.srcdoc=text.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">'+padScript);
 await new Promise((resolve,reject)=>{const end=Date.now()+15000;const timer=setInterval(()=>{
  const d=frame.contentDocument;if(d?.querySelector('#start-menu') && !d.querySelector('#start-menu').hidden){clearInterval(timer);doc=d;resolve();}
  else if(Date.now()>end){clearInterval(timer);reject(new Error('遊戲選單未就緒'));}
 },50);});
 observer=new MutationObserver(()=>{
  const black=doc.querySelector('#capture-screen');const now=!black.hidden;
  if(now && !black.wasVisible){captured++;say('被抓黑畫面顯示 #'+captured+'；近景 '+!doc.querySelector('#capture-canvas').hidden);}
  if(!now && black.wasVisible){recovered++;say('黑畫面結束／回復 #'+recovered);summary();}
  black.wasVisible=now;
 });observer.observe(doc.querySelector('#capture-screen'),{attributes:true,attributeFilter:['hidden']});
 say('實際 main.js 選單載入；繼續可用 '+!doc.querySelector('#start-continue').disabled);summary();
}
function focus(){frame.contentWindow.focus();doc.body.tabIndex=-1;doc.body.focus();}
async function pulse(i){focus();const b=frame.contentWindow.qaPad.buttons[i];b.pressed=true;b.value=1;await wait(150);b.pressed=false;b.value=0;await wait(150);}
const safe=fn=>async()=>{try{await fn();}catch(e){say('ERROR '+e.message);}};
document.querySelector('#run').onclick=safe(async()=>{
 const state=createChapter();state.checkpointId='production.checkpoint';state.inventory.itemIds=['lobby.flashlight','power.fuse','power.battery'];state.flashlight={charge:41,mode:'uv',enabled:false};state.puzzles['power.main']={installedItemId:'power.fuse',restored:true};
 localStorage.setItem(key,serializeChapterSave(state));say('預製測試存檔：生產線平台、41%、UV、已拿保險絲與電池、已供電');
 await load();await pulse(0);say('模擬 A 繼續；開始選單隱藏 '+doc.querySelector('#start-menu').hidden+'；暫停 '+!doc.querySelector('#pause-screen').hidden);
});
document.querySelector('#enter').onclick=safe(async()=>{focus();if(!doc.querySelector('#pause-screen').hidden)await pulse(9);frame.contentWindow.qaPad.axes[1]=-1;await wait(1300);frame.contentWindow.qaPad.axes[1]=0;say('已向前移動 1.3 秒，停下等待怪物；焦點 '+doc.hasFocus());});
document.querySelector('#pause').onclick=safe(async()=>{await pulse(9);say('Start 脈衝；暫停 '+!doc.querySelector('#pause-screen').hidden);});
document.querySelector('#summary').onclick=()=>summary();
document.querySelector('#reload').onclick=safe(async()=>{await load();say('框架重新載入完成');});
</script></html>
