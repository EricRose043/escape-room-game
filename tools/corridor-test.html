<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S3 獨立走廊驗證</title>
<style>body{max-width:880px;margin:24px auto;padding:0 16px;background:#111b20;color:#eee8d7;font:16px/1.6 system-ui}button{min-height:44px;padding:8px 16px;background:#334950;color:#fff;border:1px solid #d0b166;font:inherit;margin:4px}button:focus-visible{outline:3px solid #ffe28a}canvas{display:block;max-width:100%;height:auto;background:#1c2b30;border:1px solid #7e8d87}#status{min-height:3em}</style>
<h1>S3 走廊與單向關門</h1><p>這是原分工座標的獨立預覽，尚未加入正式工廠。此座標與新版列車區重疊，正式位置仍待確認；本頁不修改正式存檔，也不包含怪物。</p>
<p>WASD／方向鍵移動白色圓點；或按自動走訪。黃線是開門，紅線是關門；門只在身體完全通過後關閉，不會自行重開。</p>
<button id="auto">自動走訪三道門</button><button id="reset">重設預覽</button><p id="status" role="status"></p>
<canvas width="800" height="520" aria-label="兩次轉彎的走廊平面圖，白點為玩家，黃線開門，紅線關門"></canvas>
<script type="module">
import {CHASE_CORRIDOR as corridor,getCorridorGeometry} from '../src/logic/areas/chase-corridor.js';
import {createCorridorDoors,updateCorridorDoors} from '../src/logic/corridor-doors.js';
import {createPlayer,updatePlayer} from '../src/logic/movement.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),keys=new Set();
let player,doors,auto=false,waypoint=1,last;
const xy=(x,z)=>[36+(x-21.4)*37,36+(z+20)*28];
function reset(){player=createPlayer({...corridor.entry,paused:false});doors=updateCorridorDoors(createCorridorDoors(),player.x,player.z,corridor);auto=false;waypoint=1;keys.clear();draw();}
function draw(){
 ctx.clearRect(0,0,800,520);ctx.lineWidth=2;ctx.strokeStyle='#5c655f';ctx.beginPath();corridor.route.forEach((p,i)=>{const [x,y]=xy(p.x,p.z);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
 for(const b of corridor.boxes){const [x,y]=xy(b.minX,b.minZ);ctx.fillStyle='#96a39c';ctx.fillRect(x,y,(b.maxX-b.minX)*37,(b.maxZ-b.minZ)*28);}
 corridor.doors.forEach((d,i)=>{const b=d.bounds,[x,y]=xy(b.minX,b.minZ);ctx.fillStyle=doors.closedIds.includes(d.id)?'#fa8c7c':'#f1cf75';ctx.fillRect(x,y,Math.max(5,(b.maxX-b.minX)*37),Math.max(5,(b.maxZ-b.minZ)*28));ctx.font='16px system-ui';ctx.fillText('門 '+(i+1),x+12,y-8);});
 const [x,y]=xy(player.x,player.z);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();
 const done=waypoint>=corridor.route.length;
 status.textContent=`已關閉 ${doors.closedIds.length}／${corridor.doors.length} 道門。${done?'路線已走完。':auto?'自動走訪中。':'可用 WASD／方向鍵移動。'} 不含怪物與正式地圖整合。`;
 status.dataset.complete=String(done);
}
document.querySelector('#auto').onclick=()=>{reset();auto=true;};document.querySelector('#reset').onclick=reset;
document.addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight'].includes(e.code)){e.preventDefault();auto=false;keys.add(e.code);}});
document.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());
function frame(time){
 const dt=last===undefined?0:Math.min(.1,(time-last)/1000);last=time;
 if(!document.hidden){
  let actions={move:{x:Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),y:Number(keys.has('KeyW')||keys.has('ArrowUp'))-Number(keys.has('KeyS')||keys.has('ArrowDown'))}};
  if(auto){const p=corridor.route[waypoint];if(p&&Math.hypot(p.x-player.x,p.z-player.z)<=.26)waypoint++;
   const target=corridor.route[waypoint];if(target){player={...player,yaw:Math.atan2(-(target.x-player.x),-(target.z-player.z))};actions={move:{y:1}};}else {auto=false;actions={};}}
  else player={...player,yaw:0};
  player=updatePlayer(player,actions,dt,getCorridorGeometry(doors).collisionBoxes);
  doors=updateCorridorDoors(doors,player.x,player.z,corridor);draw();
 }
 requestAnimationFrame(frame);
}
reset();requestAnimationFrame(frame);
</script></html>
